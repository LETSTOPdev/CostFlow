<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#08090f; color:#fff; position:relative;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .glow-a { position:absolute; left:-180px; top:-220px; width:900px; height:700px;
    background:radial-gradient(closest-side, rgba(99,102,241,.38), transparent 70%); filter:blur(40px); }
  .glow-b { position:absolute; right:-160px; bottom:-260px; width:860px; height:720px;
    background:radial-gradient(closest-side, rgba(168,85,247,.34), transparent 70%); filter:blur(40px); }
  .wrap { position:relative; z-index:1; height:100%; padding:64px 72px; display:flex; gap:56px; }

  .left { width:560px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; }
  .brand img { display:block; height:68px; width:auto; }
  h1 { margin-top:88px; font-size:63px; line-height:1.08; letter-spacing:-0.03em; font-weight:700; }
  h1 .grad { background:linear-gradient(100deg,#8b8cf7,#a78bfa 55%,#c084fc);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .foot { margin-top:auto; font-size:23px; color:#8b8fa6; font-weight:500; }
  .foot b { color:#c4b5fd; font-weight:600; }

  .card { width:456px; height:502px; margin-top:0; background:#11121c;
    border:1.5px solid rgba(255,255,255,.11); border-radius:22px; padding:30px 32px;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.8), 0 0 120px rgba(139,92,246,.28); }
  .rep-pill { display:inline-block; font-size:15px; font-weight:700; letter-spacing:.09em;
    color:#b9a7ff; background:rgba(139,92,246,.15); border:1.5px solid rgba(139,92,246,.32);
    padding:7px 16px; border-radius:999px; }
  .tp { margin-top:26px; font-size:16px; font-weight:700; letter-spacing:.08em; color:#9aa0bb; }
  .big { margin-top:6px; font-size:58px; font-weight:800; letter-spacing:-0.02em;
    background:linear-gradient(120deg,#c4b5fd,#a855f7);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .range { margin-top:2px; font-size:19px; color:#8b8fa6; }
  .rows { margin-top:26px; display:flex; flex-direction:column; gap:14px; }
  .fr { background:rgba(255,255,255,.035); border:1.5px solid rgba(255,255,255,.08);
    border-radius:14px; padding:14px 18px; }
  .fr-h { display:flex; align-items:center; gap:10px; }
  .fr-rank { font-size:16px; font-weight:800; color:#7d8198; }
  .fr-t { font-size:19px; font-weight:600; color:#e8e9f2; flex:1; }
  .pill { font-size:14px; font-weight:800; padding:3px 12px; border-radius:999px; border:1.5px solid; }
  .pC { color:#f79a9d; background:rgba(239,68,68,.14); border-color:rgba(239,68,68,.36); }
  .pA { color:#5fe3b0; background:rgba(16,185,129,.14); border-color:rgba(16,185,129,.36); }
  .pB { color:#f4c36b; background:rgba(245,158,11,.14); border-color:rgba(245,158,11,.36); }
  .fr-f { display:flex; align-items:center; gap:14px; margin-top:9px; }
  .amt { font-size:19px; font-weight:800; min-width:74px; }
  .bar { flex:1; height:8px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#6366f1,#a855f7); }
</style>
</head>
<body>
  <div class="glow-a"></div><div class="glow-b"></div>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <!-- Official full logo, white-wordmark variant (dark card background). -->
        <img src="./logo-dark.png" alt="CostFlow">
      </div>
      <h1>See what workflow friction is <span class="grad">costing your team.</span></h1>
      <div class="foot">Free during beta at <b>app.fbx1.com</b></div>
    </div>
    <div class="card">
      <span class="rep-pill">FRICTION REPORT</span>
      <div class="tp">TOTAL PRICED FRICTION</div>
      <div class="big">$2,229</div>
      <div class="range">1,114 to 4,458 expected range</div>
      <div class="rows">
        <div class="fr"><div class="fr-h"><span class="fr-rank">#1</span><span class="fr-t">Queue wait in To Do</span><span class="pill pC">● C</span></div>
          <div class="fr-f"><span class="amt">$1,062</span><span class="bar"><i style="width:100%"></i></span></div></div>
        <div class="fr"><div class="fr-h"><span class="fr-rank">#2</span><span class="fr-t">Overdue exposure in To Do</span><span class="pill pA">● A</span></div>
          <div class="fr-f"><span class="amt">$342</span><span class="bar"><i style="width:42%"></i></span></div></div>
      </div>
    </div>
  </div>
</body>
</html>
